services:
  postgres:
    image: postgres:16-alpine
    container_name: scryer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: scryer
      POSTGRES_USER: scryer
      POSTGRES_PASSWORD: scryer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scryer -d scryer"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      scryer_net:
        aliases:
          - postgres
          - db

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: scryer-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://scryer:scryer@postgres:5432/scryer}
      API_PORT: ${API_PORT:-8000}
      SECRET_KEY: ${SECRET_KEY:-replace-me}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: scryer
      POSTGRES_USER: scryer
      POSTGRES_PASSWORD: scryer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      scryer_net:
        aliases:
          - backend
          - api

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scryer-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      INTERNAL_API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      scryer_net:
        aliases:
          - frontend
          - web

networks:
  scryer_net:
    driver: bridge

volumes:
  postgres_data:
