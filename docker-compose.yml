services:
  postgres:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    restart: unless-stopped
    environment:
      POSTGRES_DB: scryer
      POSTGRES_USER: scryer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup.sh to create a local password}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h postgres -X -qAt -v ON_ERROR_STOP=1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -c \"SELECT 1 WHERE NOT EXISTS (SELECT 1 FROM pg_hba_file_rules WHERE type LIKE 'host%' AND auth_method = 'trust')\" | grep -qx 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      scryer_net:
        aliases:
          - postgres
          - db

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://scryer:${POSTGRES_PASSWORD:?Run setup.sh to create a local password}@postgres:5432/scryer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      scryer_net:
        aliases:
          - backend
          - api

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      scryer_net:
        aliases:
          - frontend
          - web

networks:
  scryer_net:
    driver: bridge

volumes:
  postgres_data:
