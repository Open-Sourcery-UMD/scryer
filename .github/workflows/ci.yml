name: Scryer CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main, backend-local]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  PYTHONDONTWRITEBYTECODE: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  SCRYER_BROWSER_BIN: /usr/bin/google-chrome

jobs:
  policy:
    name: Review policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Review gate regression checks
        run: python3 -m unittest discover -s tests/foundation -p test_review_gates.py -q
      - name: Require a concrete PR description
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_pr_description.py --event "$GITHUB_EVENT_PATH"

  python:
    name: Python and PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Install the hash-verified Python lock and client lock
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements-dev.txt
          npm --prefix client ci
      - name: Lint, types, reference, foundation, and setup contracts
        run: sh scripts/check.sh fast
      - name: Database, isolation, deletion, browser sync, and real-provider checks
        run: sh scripts/check.sh sync

  engine-client:
    name: Native engine and browser client
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SCRYER_PYTHON: python3
      CXX: clang++-18
      LLVM_COV: llvm-cov-18
      LLVM_PROFDATA: llvm-profdata-18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install pinned client dependencies
        run: npm --prefix client ci
      - name: Native units, parity, 10000 generated cases, and measured coverage
        run: sh scripts/check.sh engine
      - name: TypeScript and real Chrome client checks
        run: sh scripts/check.sh client

  frontend:
    name: Frontend and journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            frontend/package-lock.json
      - name: Install from both npm lockfiles
        run: |
          npm --prefix client ci
          npm --prefix frontend ci
      - name: Lint, optimized build, types, demo, preview, and design-prototype checks
        run: sh scripts/check.sh frontend

  containers:
    name: Clean container rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SCRYER_PYTHON: python3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Clean committed setup, real readiness, outage, and restart persistence
        run: sh scripts/check.sh containers

  security:
    name: Dependency and secret scans
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Install the lock and SHA-256 verified secret scanner
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements-dev.txt
          .venv/bin/python scripts/install_gitleaks.py
      - name: Fail on candidate secrets or known vulnerable locked dependencies
        run: sh scripts/check.sh security

  required:
    name: Required checks
    if: always()
    needs: [policy, python, engine-client, frontend, containers, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Reject any missing, failed, cancelled, or skipped required job
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/check_ci_results.py
