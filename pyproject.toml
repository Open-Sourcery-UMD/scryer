[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["engine/vendor", "client/vendor", ".backend-artifacts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
files = ["scryer_reference", "sync", "main.py", "scripts/check_pr_description.py"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["psycopg.*"]
ignore_missing_imports = true
